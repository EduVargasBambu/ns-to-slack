<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Centro de Autorización</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Grupo Vallas identity: charcoal band, warm white field, orange only where a decision lives. */
      :root {
        --charcoal: #3d3d3c;
        --charcoal-deep: #2b2b2a;
        --ink: #262625;
        --muted: #63625f;
        --faint: #8b8a86;
        --ground: #f4f3f1;
        --surface: #ffffff;
        --surface-2: #faf9f7;
        --line: #e8e6e2;
        --line-strong: #d3d0ca;
        --orange: #e07b39;
        --orange-hover: #d36d2b;
        --on-orange: #1f1f1e;
        --orange-ink: #9a4a16;
        --orange-tint: #fcebdd;
        --orange-wash: #fdf4ed;
        --danger: #a8331f;
        --danger-tint: #fbece8;
        --ok-bg: #e9f4ec;
        --ok-text: #1d5a2e;
        --err-bg: #fbe9e6;
        --err-text: #8a2414;
        --radius: 14px;
        --pill: 999px;
        --shadow-card: 0 1px 2px rgba(38, 38, 37, 0.05), 0 4px 14px rgba(38, 38, 37, 0.05);
        --shadow-bar: 0 -6px 20px rgba(38, 38, 37, 0.08);
        --font:
          'Avenir Next', Avenir, 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: var(--orange-tint);
        color: var(--ink);
      }
      html {
        scrollbar-color: var(--line-strong) var(--ground);
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
        padding-bottom: 200px;
        accent-color: var(--orange);
      }
      :focus-visible {
        outline: 2px solid var(--charcoal);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .muted {
        color: var(--muted);
      }

      /* Charcoal band, like the website footer brought to the top */
      .topbar {
        background: var(--charcoal);
        color: #fff;
      }
      .topbar-inner,
      main,
      .bar-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding-left: 24px;
        padding-right: 24px;
      }
      .topbar-inner {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-top: 14px;
        padding-bottom: 14px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
      }
      .brand-name {
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: 0.08em;
      }
      .brand-app {
        font-size: 0.85rem;
        color: #d9d7d2;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.9rem;
        color: #ecebe7;
        min-width: 0;
      }
      #who {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .avatar {
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--orange);
        color: var(--on-orange);
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .avatar:empty {
        display: none;
      }

      main {
        padding-top: 32px;
      }
      .page-head {
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.75rem;
        font-weight: 400;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        line-height: 1.15;
        text-wrap: balance;
      }
      #overview {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      #overview strong {
        color: var(--ink);
      }

      /* Proposal card */
      .group {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        margin-bottom: 24px;
        overflow: hidden;
      }
      .group-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px 20px;
        flex-wrap: wrap;
        padding: 18px 22px;
      }
      .group-title {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .group-head h2 {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0;
      }
      .level {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--orange-ink);
        background: var(--orange-tint);
        padding: 4px 12px;
        border-radius: var(--pill);
        white-space: nowrap;
      }
      .group-stats {
        display: flex;
        gap: 6px 18px;
        flex-wrap: wrap;
        font-size: 0.9rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .group-stats strong {
        color: var(--ink);
      }

      /* Currency strip above each table */
      .currency-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px 14px;
        flex-wrap: wrap;
        padding: 10px 22px;
        font-size: 0.88rem;
        color: var(--muted);
        background: var(--surface-2);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .currency-head strong {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .currency-head > span:last-child {
        margin-left: auto;
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .col-bill {
        width: 22%;
      }
      .col-due {
        width: 120px;
      }
      th.col-amount {
        width: 200px;
      }
      th {
        text-align: left;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td {
        padding: 14px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr {
        transition: background-color 160ms cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
      }
      tbody tr:hover {
        background: var(--surface-2);
      }
      tbody tr:has(input:checked) {
        background: var(--orange-wash);
      }
      .col-check {
        width: 52px;
        padding-left: 22px;
        padding-right: 4px;
      }
      .col-amount {
        text-align: right;
        padding-right: 22px;
      }
      .vendor {
        font-weight: 700;
        overflow-wrap: break-word;
      }
      .priority {
        display: inline-block;
        margin-left: 8px;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: var(--pill);
        white-space: nowrap;
        vertical-align: 1px;
      }
      .priority-0 {
        color: var(--on-orange);
        background: var(--orange);
      }
      .priority-1 {
        color: var(--orange-ink);
        background: var(--orange-tint);
      }
      .priority-2 {
        color: var(--muted);
        background: #eeedea;
      }
      .bill a {
        color: var(--ink);
        text-decoration-color: var(--line-strong);
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
        overflow-wrap: break-word;
      }
      .bill a:hover {
        text-decoration-color: var(--orange);
      }
      .due {
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .amount {
        font-weight: 700;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .currency {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--faint);
        margin-right: 6px;
      }
      input[type='checkbox'] {
        width: 20px;
        height: 20px;
        margin: 0;
        vertical-align: middle;
        cursor: pointer;
      }

      /* Phones: each row becomes a compact card */
      @media (max-width: 640px) {
        .topbar-inner,
        main,
        .bar-inner {
          padding-left: 16px;
          padding-right: 16px;
        }
        .topbar-inner {
          min-height: 64px;
        }
        main {
          padding-top: 22px;
        }
        h1 {
          font-size: 1.35rem;
        }
        .group-head {
          padding: 16px;
        }
        .currency-head {
          padding: 10px 16px;
        }
        table,
        tbody {
          display: block;
        }
        thead {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
        }
        tbody tr {
          display: grid;
          grid-template-columns: 36px 1fr auto;
          grid-template-areas:
            'check vendor vendor'
            'check bill amount'
            'check due due';
          column-gap: 8px;
          row-gap: 3px;
          padding: 14px 16px;
          border-bottom: 1px solid var(--line);
        }
        tbody tr:last-child {
          border-bottom: 0;
        }
        td {
          padding: 0;
          border: 0;
        }
        td.col-check {
          grid-area: check;
          padding: 2px 0 0;
          width: auto;
        }
        td.vendor {
          grid-area: vendor;
          min-width: 0;
        }
        td.bill {
          grid-area: bill;
          font-size: 0.88rem;
        }
        td.due {
          grid-area: due;
          font-size: 0.85rem;
        }
        td.due::before {
          content: 'vence ';
        }
        td.col-amount {
          grid-area: amount;
          padding: 0;
          align-self: center;
        }
      }
      .select-all-mobile {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        font-size: 0.9rem;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      @media (max-width: 640px) {
        .select-all-mobile {
          display: flex;
        }
      }

      /* Loading and empty states */
      .skeleton {
        height: 14px;
        border-radius: 7px;
        background: linear-gradient(90deg, #eeece8 0%, #f7f6f3 50%, #eeece8 100%);
        background-size: 200% 100%;
        animation: shimmer 1.2s ease-in-out infinite;
      }
      .skeleton-row {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }
      @keyframes shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
        }
        tbody tr,
        button {
          transition: none;
        }
      }
      .empty {
        text-align: center;
        padding: 56px 24px;
      }
      .empty strong {
        display: block;
        font-size: 1.15rem;
        margin-bottom: 4px;
      }

      /* Action bar */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--surface);
        box-shadow: var(--shadow-bar);
        padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
      }
      .bar-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px 20px;
        flex-wrap: wrap;
      }
      #summary {
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
      }
      #summary strong {
        color: var(--ink);
      }
      #summary .sum-cur {
        white-space: nowrap;
      }
      #summary .sum-cur::before {
        content: ' · ';
      }
      @media (max-width: 640px) {
        #summary strong {
          display: block;
        }
        #summary .sum-cur:first-of-type::before {
          content: '';
        }
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 11px 24px;
        min-height: 46px;
        border-radius: var(--pill);
        border: 1.5px solid transparent;
        cursor: pointer;
        transition:
          background-color 160ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 160ms cubic-bezier(0.16, 1, 0.3, 1),
          opacity 160ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .primary {
        background: var(--orange);
        color: var(--on-orange);
      }
      .primary:not(:disabled):hover {
        background: var(--orange-hover);
      }
      .danger {
        background: var(--surface);
        color: var(--charcoal);
        border-color: var(--charcoal);
      }
      .danger:not(:disabled):hover {
        background: var(--surface-2);
      }
      dialog .danger {
        color: var(--danger);
        border-color: var(--danger);
      }
      dialog .danger:hover {
        background: var(--danger-tint);
      }
      .ghost {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--line-strong);
      }
      .ghost:hover {
        background: var(--surface-2);
      }
      @media (max-width: 640px) {
        .actions {
          width: 100%;
        }
        .actions button {
          flex: 1;
        }
      }
      .message {
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 10px;
        font-size: 0.92rem;
      }
      .message.ok {
        background: var(--ok-bg);
        color: var(--ok-text);
      }
      .message.error {
        background: var(--err-bg);
        color: var(--err-text);
      }

      /* Discard dialog */
      dialog {
        border: 0;
        border-radius: 18px;
        width: min(480px, calc(100% - 32px));
        padding: 24px;
        box-shadow: 0 16px 48px rgba(38, 38, 37, 0.22);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(43, 43, 42, 0.5);
      }
      dialog h2 {
        font-size: 1.15rem;
        margin: 0 0 4px;
      }
      dialog label {
        display: block;
        font-weight: 700;
        font-size: 0.9rem;
        margin-top: 16px;
      }
      textarea {
        width: 100%;
        min-height: 104px;
        font: inherit;
        padding: 10px 12px;
        margin: 6px 0 18px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        resize: vertical;
        caret-color: var(--orange);
      }
      textarea:focus-visible {
        border-color: var(--charcoal);
      }
      dialog .actions {
        justify-content: flex-end;
      }

      /* Treasury view (?view=authorized): read-only, no checkboxes or action bar */
      body.readonly {
        padding-bottom: 40px;
      }
      body.readonly tbody tr {
        cursor: default;
      }
      @media (max-width: 640px) {
        body.readonly tbody tr {
          grid-template-columns: 1fr auto;
          grid-template-areas:
            'vendor vendor'
            'bill amount'
            'due due';
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-name">GRUPO VALLAS</span>
          <span class="brand-app">Centro de Autorización</span>
        </div>
        <div class="user">
          <span id="who"></span>
          <span id="avatar" class="avatar" aria-hidden="true"></span>
        </div>
      </div>
    </header>
    <main>
      <div class="page-head">
        <h1 id="title">Facturas por autorizar</h1>
        <p id="overview" class="muted"></p>
      </div>
      <div id="groups" aria-busy="true"></div>
    </main>
    <footer class="bar">
      <div class="bar-inner">
        <div id="message" role="status" aria-live="polite"></div>
        <div class="bar-row">
          <div id="summary" class="muted">Selecciona facturas</div>
          <div class="actions">
            <button id="discard" class="danger" disabled>Descartar…</button>
            <button id="approve" class="primary" disabled>Aprobar</button>
          </div>
        </div>
      </div>
    </footer>
    <dialog id="discard-dialog" aria-labelledby="discard-title">
      <form method="dialog">
        <h2 id="discard-title">Descartar facturas</h2>
        <div class="muted">Las facturas regresan a pendientes para un concentrado futuro.</div>
        <label for="reason">Motivo</label>
        <textarea id="reason" maxlength="1000"></textarea>
        <div class="actions">
          <button value="cancel" class="ghost">Cancelar</button>
          <button value="confirm" class="danger">Descartar</button>
        </div>
      </form>
    </dialog>
    <script>
      (() => {
        const money = new Intl.NumberFormat('es-MX', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        const $ = (id) => document.getElementById(id);
        /** lineId -> line, for the selected totals. */
        let linesById = new Map();
        let busy = false;
        /** Treasury view: authorized bills still to pay, read-only. */
        const readOnly = new URLSearchParams(window.location.search).get('view') === 'authorized';

        /** Same currency order as the server: USD, MXN, then any other alphabetically. */
        const CURRENCY_ORDER = ['USD', 'MXN'];
        const CURRENCY_NAMES = { USD: 'Dólares', MXN: 'Pesos' };
        const byCurrency = (a, b) => {
          const rank = (c) => (CURRENCY_ORDER.includes(c) ? CURRENCY_ORDER.indexOf(c) : 99);
          return rank(a) - rank(b) || a.localeCompare(b);
        };

        const url = (action) => {
          const u = new URL(window.location.href);
          u.searchParams.set('action', action);
          return u.toString();
        };

        const el = (tag, attrs = {}, children = []) => {
          const node = document.createElement(tag);
          Object.entries(attrs).forEach(([k, v]) => {
            if (k === 'text') node.textContent = v;
            else node.setAttribute(k, v);
          });
          children.forEach((c) => node.appendChild(c));
          return node;
        };

        const formatTotals = (totals) =>
          Object.keys(totals)
            .sort(byCurrency)
            .map((code) => `${code} $${money.format(totals[code])}`)
            .join(' · ');

        const selectedIds = () =>
          [...document.querySelectorAll('input[data-line]:checked')].map((i) => i.dataset.line);

        const selectedTotals = (ids) => {
          const totals = {};
          ids.forEach((id) => {
            const line = linesById.get(id);
            totals[line.currency] = (totals[line.currency] || 0) + line.amount;
          });
          return totals;
        };

        const refreshFooter = () => {
          const ids = selectedIds();
          const summary = $('summary');
          if (busy) {
            summary.textContent = 'Procesando…';
          } else if (ids.length) {
            summary.replaceChildren(
              el('strong', { text: `${ids.length} seleccionadas` }),
              ...Object.keys(selectedTotals(ids))
                .sort(byCurrency)
                .map((code) =>
                  el('span', {
                    class: 'sum-cur',
                    text: `${code} $${money.format(selectedTotals(ids)[code])}`,
                  }),
                ),
            );
          } else {
            summary.textContent = 'Selecciona facturas';
          }
          $('approve').disabled = busy || !ids.length;
          $('discard').disabled = busy || !ids.length;
          $('approve').textContent = ids.length > 1 ? `Aprobar ${ids.length}` : 'Aprobar';
        };

        const showMessage = (text, kind) => {
          const box = $('message');
          box.replaceChildren();
          if (text) box.appendChild(el('div', { class: `message ${kind}`, text }));
        };

        const renderSkeleton = () => {
          const rows = [0, 1, 2, 3].map(() =>
            el('div', { class: 'skeleton-row' }, [
              el('div', { class: 'skeleton', style: 'width:20px;height:20px' }),
              el('div', { class: 'skeleton', style: 'flex:2' }),
              el('div', { class: 'skeleton', style: 'flex:1' }),
              el('div', { class: 'skeleton', style: 'width:110px' }),
            ]),
          );
          $('groups').replaceChildren(el('section', { class: 'group' }, rows));
        };

        const renderLine = (line) => {
          const billLink = el('a', {
            href: `/app/accounting/transactions/vendbill.nl?id=${encodeURIComponent(line.billId)}`,
            target: '_blank',
            rel: 'noopener',
            text: line.billNumber || 'Ver factura',
          });
          const cells = [
            el('td', { class: 'vendor' }, [
              document.createTextNode(line.vendor || 'Proveedor'),
              ...(line.priority
                ? [
                    el('span', {
                      class: `priority priority-${line.priorityRank}`,
                      title: 'Prioridad del proveedor',
                      text: line.priority,
                    }),
                  ]
                : []),
            ]),
            el('td', { class: 'bill' }, [billLink]),
            el('td', { class: 'due', text: line.dueDate || '—' }),
            el('td', { class: 'col-amount' }, [
              el('span', { class: 'amount' }, [
                el('span', { class: 'currency', text: line.currency }),
                document.createTextNode(`$${money.format(line.amount)}`),
              ]),
            ]),
          ];
          if (readOnly) return el('tr', {}, cells);

          const box = el('input', {
            type: 'checkbox',
            'data-line': line.lineId,
            'aria-label': `Seleccionar ${line.vendor || 'factura'} ${line.billNumber || ''}`,
          });
          box.addEventListener('change', refreshFooter);
          const row = el('tr', {}, [el('td', { class: 'col-check' }, [box]), ...cells]);
          // Clicking anywhere on the row toggles it; links and the box keep their own click.
          row.addEventListener('click', (e) => {
            if (e.target.closest('a, input')) return;
            box.checked = !box.checked;
            refreshFooter();
          });
          return row;
        };

        const renderGroup = (group) => {
          const label = readOnly
            ? `concentrado del ${group.meetingDate}`
            : `concentrado del ${group.meetingDate}, ${group.levelName}`;
          const rows = group.lines.map(renderLine);
          const boxesOf = (list) => list.map((r) => r.querySelector('input'));
          // Phones hide the table headers, so they get one "select all" for the whole group.
          const mobileBox = el('input', {
            type: 'checkbox',
            id: `all-${group.proposalId}-${group.levelId || ''}`,
          });
          /** One table per currency; rows keep the server order (priority, then amount). */
          const currencies = [...new Set(group.lines.map((l) => l.currency))].sort(byCurrency);
          const headBoxes = [];
          const sections = currencies.flatMap((code) => {
            const lines = group.lines.filter((l) => l.currency === code);
            const tableRows = rows.filter((_, i) => group.lines[i].currency === code);
            const total = lines.reduce((sum, l) => sum + l.amount, 0);
            const headBox = el('input', {
              type: 'checkbox',
              'aria-label': `Seleccionar todas en ${code}: ${label}`,
            });
            headBoxes.push(headBox);
            headBox.addEventListener('change', () => {
              boxesOf(tableRows).forEach((b) => {
                b.checked = headBox.checked;
              });
              mobileBox.checked = boxesOf(rows).every((b) => b.checked);
              refreshFooter();
            });
            const currencyHead = el('div', { class: 'currency-head' }, [
              el('strong', { text: `${CURRENCY_NAMES[code] || code} (${code})` }),
              el('span', {
                text: `${lines.length} ${lines.length === 1 ? 'factura' : 'facturas'}`,
              }),
              el('span', {}, [el('strong', { text: `$${money.format(total)}` })]),
            ]);
            const table = el('table', {}, [
              el('thead', {}, [
                el('tr', {}, [
                  ...(readOnly ? [] : [el('th', { class: 'col-check', scope: 'col' }, [headBox])]),
                  el('th', { scope: 'col', text: 'Proveedor' }),
                  el('th', { class: 'col-bill', scope: 'col', text: 'Factura' }),
                  el('th', { class: 'col-due', scope: 'col', text: 'Vence' }),
                  el('th', { class: 'col-amount', scope: 'col', text: 'Monto' }),
                ]),
              ]),
              el('tbody', {}, tableRows),
            ]);
            return [currencyHead, table];
          });
          mobileBox.addEventListener('change', () => {
            [...boxesOf(rows), ...headBoxes].forEach((b) => {
              b.checked = mobileBox.checked;
            });
            refreshFooter();
          });

          const head = el('div', { class: 'group-head' }, [
            el('div', { class: 'group-title' }, [
              el('h2', { text: `Concentrado del ${group.meetingDate}` }),
              ...(readOnly
                ? []
                : [el('span', { class: 'level', text: `Nivel: ${group.levelName}` })]),
            ]),
            el('div', { class: 'group-stats' }, [
              el('span', {}, [
                el('strong', { text: String(group.lines.length) }),
                document.createTextNode(group.lines.length === 1 ? ' factura' : ' facturas'),
              ]),
              ...Object.keys(group.totals)
                .sort(byCurrency)
                .map((code) =>
                  el('span', {}, [
                    document.createTextNode(`${code} `),
                    el('strong', { text: `$${money.format(group.totals[code])}` }),
                  ]),
                ),
            ]),
          ]);
          const mobileAll = el('label', { class: 'select-all-mobile', for: mobileBox.id }, [
            mobileBox,
            document.createTextNode('Seleccionar todas'),
          ]);
          return el(
            'section',
            { class: 'group', 'aria-label': label },
            readOnly ? [head, ...sections] : [head, mobileAll, ...sections],
          );
        };

        const load = async () => {
          const res = await fetch(url(readOnly ? 'authorized' : 'pending'), {
            credentials: 'same-origin',
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || 'No se pudieron cargar las facturas.');
          $('who').textContent = data.userName;
          $('avatar').textContent = (data.userName || '').trim().charAt(0).toUpperCase();
          const lines = data.groups.flatMap((g) => g.lines);
          const overallTotals = {};
          lines.forEach((l) => {
            overallTotals[l.currency] = (overallTotals[l.currency] || 0) + l.amount;
          });
          $('overview').replaceChildren(
            ...(lines.length
              ? [
                  el('strong', {
                    text: `${lines.length} ${lines.length === 1 ? 'factura' : 'facturas'}`,
                  }),
                  document.createTextNode(` · ${formatTotals(overallTotals)}`),
                ]
              : []),
          );
          linesById = new Map();
          data.groups.forEach((g) => g.lines.forEach((l) => linesById.set(l.lineId, l)));
          const container = $('groups');
          container.replaceChildren(
            ...(data.groups.length
              ? data.groups.map(renderGroup)
              : [
                  el('section', { class: 'group empty' }, [
                    el('strong', { text: readOnly ? 'Nada por pagar' : 'Estás al día' }),
                    el('span', {
                      class: 'muted',
                      text: readOnly
                        ? 'No hay facturas autorizadas pendientes de pago.'
                        : 'No tienes facturas esperando tu autorización.',
                    }),
                  ]),
                ]),
          );
          container.setAttribute('aria-busy', 'false');
          refreshFooter();
        };

        const describe = (counts) => {
          const approved = (counts.ADVANCED || 0) + (counts.AUTHORIZED || 0);
          const parts = [];
          if (approved) parts.push(`Aprobaste ${approved}`);
          if (counts.AUTHORIZED) parts.push(`${counts.AUTHORIZED} quedaron autorizadas`);
          if (counts.DISCARDED) parts.push(`Descartaste ${counts.DISCARDED}`);
          if (counts.NOT_PENDING) parts.push(`${counts.NOT_PENDING} ya no estaban pendientes`);
          if (counts.UNAUTHORIZED) parts.push(`${counts.UNAUTHORIZED} no te correspondían`);
          if (counts.NOT_PROCESSED) {
            parts.push(
              `faltan ${counts.NOT_PROCESSED}: vuelve a seleccionarlas y da clic otra vez`,
            );
          }
          return `${parts.join('. ')}.`;
        };

        const send = async (action, reason) => {
          const lineIds = selectedIds();
          busy = true;
          showMessage('');
          refreshFooter();
          try {
            const res = await fetch(url(action), {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json', 'X-GPV-Request': '1' },
              body: JSON.stringify({ lineIds, reason }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);
            showMessage(describe(data.counts), 'ok');
            await load();
          } catch (e) {
            showMessage(e.message || 'No se pudo completar.', 'error');
          } finally {
            busy = false;
            refreshFooter();
          }
        };

        $('approve').addEventListener('click', () => {
          const ids = selectedIds();
          const totals = formatTotals(selectedTotals(ids));
          if (window.confirm(`¿Confirmas aprobar ${ids.length} facturas por ${totals}?`)) {
            send('approve');
          }
        });

        const dialog = $('discard-dialog');
        $('discard').addEventListener('click', () => {
          $('reason').value = '';
          dialog.showModal();
        });
        dialog.addEventListener('close', () => {
          if (dialog.returnValue === 'confirm') send('discard', $('reason').value);
        });

        if (readOnly) {
          document.body.classList.add('readonly');
          document.title = 'Facturas autorizadas';
          $('title').textContent = 'Facturas autorizadas por pagar';
          document.querySelector('footer.bar').hidden = true;
        }
        renderSkeleton();
        load().catch((e) => {
          // Shown in the page, not the action bar: the treasury view has no bar.
          $('groups').replaceChildren(el('div', { class: 'message error', text: e.message }));
          $('groups').setAttribute('aria-busy', 'false');
        });
      })();
    </script>
  </body>
</html>
